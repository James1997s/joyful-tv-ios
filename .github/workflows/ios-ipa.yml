name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew list go >/dev/null 2>&1 || brew install go
          brew list swiftlint >/dev/null 2>&1 || brew install swiftlint
          brew list cocoapods >/dev/null 2>&1 || brew install cocoapods

      - name: Validate public WARP profile
        run: |
          test -s Sources/WireGuardApp/UI/iOS/warp_profile.conf
          plutil -lint Sources/WireGuardApp/UI/iOS/Info.plist

      - name: Configure app identifier
        run: |
          cat > Sources/WireGuardApp/Config/Developer.xcconfig <<'EOF'
          DEVELOPMENT_TEAM =
          APP_ID_IOS = com.joyful.watch.iptv
          APP_ID_MACOS = com.joyful.watch.iptv.mac
          EOF

      - name: Install VLC media framework
        run: pod install --repo-update

      - name: Build iOS app for device
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace WireGuard.xcworkspace \
            -scheme WireGuardiOS \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/xcodebuild.log" | tail -n 100

      - name: Ad-hoc sign app and packet tunnel entitlements
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/WireGuard.app"
          EXT="$APP/PlugIns/WireGuardNetworkExtension.appex"
          test -x "$APP/WireGuard"
          test -x "$EXT/WireGuardNetworkExtension"
          test -s "$APP/MobileVLCKit-LICENSE.txt"
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -depth -type d -name '*.framework' -print0 | while IFS= read -r -d '' FRAMEWORK; do
              EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$FRAMEWORK/Info.plist" 2>/dev/null || true)
              if [ -n "$EXECUTABLE" ] && /usr/bin/otool -hv "$FRAMEWORK/$EXECUTABLE" 2>/dev/null | grep -q 'DYLIB'; then
                codesign --force --sign - --timestamp=none "$FRAMEWORK"
              fi
            done
          fi
          python3 - "$RUNNER_TEMP/app-entitlements.plist" "$RUNNER_TEMP/extension-entitlements.plist" <<'PY'
          import plistlib, sys
          app = {
              "com.apple.developer.networking.networkextension": ["packet-tunnel-provider"],
              "com.apple.developer.networking.wifi-info": True,
              "com.apple.security.application-groups": ["group.com.joyful.watch.iptv"],
          }
          extension = {
              "com.apple.developer.networking.networkextension": ["packet-tunnel-provider"],
              "com.apple.security.application-groups": ["group.com.joyful.watch.iptv"],
          }
          for path, value in zip(sys.argv[1:], (app, extension)):
              with open(path, "wb") as output:
                  plistlib.dump(value, output, fmt=plistlib.FMT_XML)
          PY
          codesign --force --sign - --timestamp=none --entitlements "$RUNNER_TEMP/extension-entitlements.plist" "$EXT"
          codesign --force --sign - --timestamp=none --entitlements "$RUNNER_TEMP/app-entitlements.plist" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package jailbreak IPA
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/WireGuard.app"
          test -d "$APP"
          test -d "$APP/PlugIns/WireGuardNetworkExtension.appex"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qr "$GITHUB_WORKSPACE/JoyfulTV-iOS-jailbreak.ipa" Payload)
          test -s "$GITHUB_WORKSPACE/JoyfulTV-iOS-jailbreak.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: JoyfulTV-iOS-jailbreak
          path: JoyfulTV-iOS-jailbreak.ipa
          if-no-files-found: error
          retention-days: 14
